name: ci

on: [push, workflow_dispatch]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Packages
        run: npm ci

      - name: Generate Wrangler Types
        run: npm run types

      - name: Run Prettier
        run: npm run format

      - name: Commit Changes
        uses: EndBug/add-and-commit@v11
        with:
          message: 'chore: update types and format'
          default_author: github_actions